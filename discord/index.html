  <style>
    button {
      display: inline-block;
      border-radius: 4px;
      background-color: #5865F2;
      border: none;
      color: #23272A;
      text-align: center;
      font-size: 28px;
      padding: 10%;
      width: 80%;
      transition: all 0.5s;
      cursor: pointer;
      margin: 5px;
      font-family: fredoka one;
      font-size: 50px;
    }

    button span {
      cursor: pointer;
      display: inline-block;
      position: relative;
      transition: 0.5s;
    }

    button span:after {
      content: "\00bb";
      position: absolute;
      opacity: 0;
      top: 0;
      right: -300px;
      transition: 0.5s;
    }

    button:hover span {
      padding-right: 45px;
    }

    button:hover span:after {
      opacity: 1;
      right: 0;
    }
    button img {
        height: 100px;
        display: inline-block;
    }
  </style>

    src="https://code.jquery.com/jquery-3.3.1.js"
