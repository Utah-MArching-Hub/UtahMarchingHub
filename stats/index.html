<div id="header"></div>

    <div id="content">
        <!-- PUT BODY HERE -->
        <h1 class="YHead">SCHOOL STATS</h1>

        <div class="dropdown">
            <button onclick="showDrop()" class="dropbtn">Dropdown</button>
            <div id="myDropdown" class="dropdown-content">
              <input type="text" placeholder="Search.." id="myInput" onkeyup="filterFunction()">

                    <th onclick="sortTable(this)" value="MEnsemble">Music Ensemble</th>
                    <th onclick="sortTable(this)" value="MEffect">Music Effect</th>
                    <th onclick="sortTable(this)" value="MScore">Music</th>

                    <th onclick="sortTable(this)" value="VEffect">Visual Effect</th>
                    <th onclick="sortTable(this)" value="VScore">Visual</th>
                    <th onclick="sortTable(this)" value="Percussion">Percussion</th>
                    <th onclick="sortTable(this)" value="Guard">Guard</th>
                </thead>
            </table>
        </div>
        <div>
            <h2 class="YHead">2022 score progresion!</h2>
