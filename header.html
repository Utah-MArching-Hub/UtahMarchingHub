<html>
<link href='https://fonts.googleapis.com/css?family=Fredoka One' rel='stylesheet'>
<head>
	<meta charset="utf-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1">
  	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet">
  	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<style>
	.head ul {
		list-style-type: none;
		margin: 0;
		padding: 0;
		overflow: hidden;
		background-color: #002868;
	}

	.head li {
		float: left;
	}

	.head li a {
		display: block;
		color: white;
		text-align: center;
		padding: 14px 16px;
		text-decoration: none;
		font-family: 'Fredoka one';font-size: 16px;

	}

	.head li a:hover,
	.head li a:focus {
		background-color: #ffffff44;
	}

	.heads1 {
		display: block;
		background-color: #002868;
		color: #ffc324;
		text-align: center;
		margin: 0;
		padding: 0;
		font-family: 'Fredoka one';font-size: 48px;
	}
	
	#header {
		height: max-content;
		z-index: 10;
	}
	.skip-content {
		font-size: 1rem;
		text-decoration: none;
		color: black;
		background: white;
		border: 0.2em black solid;
		border-bottom-right-radius: 0.5em;
		padding: 0.25em;

		position: absolute;
		top: -5em;
		transition: top 100ms;
	}

	.skip-content:hover,
	.skip-content:focus {
		/* background-color: grey; */
		top: 0;
	}
</style>

<script>
	function setHeaderHight() {
		document.querySelector("#header").style.height = (document.querySelector('#header-text').clientHeight + document.querySelector('nav').clientHeight) + 'px';
	}
	// setHeaderHight()

	console.log(document.querySelector('#header-text').offsetHeight)
	$(window).scroll(function(){
		setHeaderHight()
	    if ($(window).scrollTop() >= document.querySelector('#header-text').offsetHeight) {
	        $('nav').addClass('fixed-top');
	    }
	    else {
	        $('nav').removeClass('fixed-top');
	    }
	});

	$(window).resize(function(){setHeaderHight()})

	document.addEventListener("DOMContentLoaded", function(){
		setHeaderHight()
	});
</script>


<body>
	<div id="header-text" class="p-4 text-center container-fluid" style="font-family: 'Fredoka one'; background-image: linear-gradient(#002868,#002868 150px,#004dc9 350px, #004dc9 2000px); z-index: inherit;">
		<h1 class="display-1" style=" color: #FFC324; z-index: inherit;">Utah Marching Hub!</h1>
	</div>
	<nav id="mainNavbar" class="navbar navbar-expand-lg bg-dark navbar-dark" style="font-size: 18px; z-index: inherit;">
		
		<div class="container-fluid">
			<a class="navbar-brand" href="/">
			<img class="rounded-pill" src="/common/images/icons/UMH/logo.png" alt="bruh2" width="40" style="padding-left: 5px;">
			Utah Marching Hub!
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-content" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			  </button>
			
			<div id="navbar-content" class="collapse navbar-collapse">
			<ul class="navbar-nav mr-auto">
				<li class="nav-item container text-center">
					<a class="nav-link" href="/scores/">Scores</a>
				</li>
				<li class="nav-item container text-center">
					<a class="nav-link" href="/schools/">Schools</a>
				</li>
				<li class="nav-item container text-center">
					<a class="nav-link" href="/events/">Schedule</a>
				</li>
				<li class="nav-item container text-center">
					<a class="nav-link" href="/credits/">Credits</a>
				</li>
				<li class="nav-item container text-center">
					<a class="nav-link" href="/events/">Events</a>
				</li>
			</ul>
		</div>

		</div>

	</nav>

</body>

</html>
